<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moveasy mark">
  <!--
    Approximation of the Moveasy "1m" mark.
    Single brushstroke: a 1-like vertical opening on the left, then three
    rounded humps with pointed serif terminals at the baselines.
    Designed to be recolored via currentColor.
  -->
  <g fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Opening "1" stroke: small flag descending into a tall vertical -->
    <path d="M 140 110 L 175 88 L 175 90" />
    <path d="M 175 130 L 175 412" />

    <!-- Three humps + serif terminals, drawn as one continuous M -->
    <path d="M 175 412
             L 175 412
             C 175 372, 195 232, 220 232
             C 245 232, 260 280, 270 360
             L 280 412
             C 280 412, 280 412, 280 412
             C 280 372, 300 232, 325 232
             C 350 232, 365 280, 375 360
             L 385 412
             C 385 412, 385 412, 385 412
             C 385 372, 405 232, 432 232
             C 457 232, 472 280, 475 412" />
  </g>
</svg>
